<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配音替换 · DubbingX</title>
<style>
  :root { --bg:#15161a; --panel:#1d1f25; --line:#2c2f37; --txt:#e8eaee; --mut:#8f96a3; --accent:#e97036; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; }
  header b { font-size:16px; }
  header a { color:var(--mut); font-size:13px; text-decoration:none; margin-left:auto; }
  header a:hover { color:var(--accent); }
  main { max-width:860px; margin:0 auto; padding:18px 20px 60px; display:flex; flex-direction:column; gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card h2 { font-size:13px; margin:0 0 10px; color:var(--mut); font-weight:600; letter-spacing:.4px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input[type=text], input[type=tel], input[type=number] { background:#121317; border:1px solid var(--line); color:var(--txt);
    border-radius:7px; padding:8px 10px; font-size:14px; outline:none; }
  input[type=text]:focus, input[type=tel]:focus { border-color:#4a4f5b; }
  button { background:#2b2f38; color:var(--txt); border:1px solid var(--line); border-radius:7px; padding:8px 14px;
    cursor:pointer; font-size:13px; }
  button:hover:not(:disabled) { border-color:#4a4f5b; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .hint { color:var(--mut); font-size:12px; }
  .grow { flex:1; }
  #timbreList { display:flex; flex-direction:column; gap:6px; max-height:260px; overflow:auto; margin-top:8px; }
  .timbre { display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; cursor:pointer; }
  .timbre.on { border-color:var(--accent); background:#2a2119; }
  .timbre b { font-weight:600; }
  .timbre small { color:var(--mut); }
  .scenes { display:flex; flex-direction:column; gap:6px; }
  .sc { display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; }
  .sc .nm { width:150px; color:var(--mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sc .st { flex:1; font-size:13px; }
  .sc .st.ok { color:#63c68a; }
  .sc .st.err { color:#e2665c; }
  .sc .st.run { color:#e9b04e; }
  #log { font:12px/1.6 ui-monospace,Menlo,monospace; color:var(--mut); white-space:pre-wrap; max-height:220px; overflow:auto; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; background:#2b2f38; font-size:12px; color:var(--mut); }
  input[type=range] { width:190px; accent-color:var(--accent); }
  .val { font-variant-numeric:tabular-nums; width:46px; display:inline-block; text-align:right; color:var(--accent); }
</style>
</head>
<body>
<header>
  <b>配音替换</b><span class="hint">DubbingX · 免费音色 · 真人感</span>
  <a href="index.html">← 回到预览台</a>
</header>

<main>
  <div class="card">
    <h2>1 · 登录 DubbingX</h2>
    <div class="row" id="loginRow">
      <input id="phone" type="tel" placeholder="手机号" maxlength="11" style="width:150px">
      <button id="sendCode">发送验证码</button>
      <input id="code" type="text" placeholder="6 位验证码" maxlength="6" style="width:120px">
      <button id="doLogin" class="primary">登录</button>
      <span id="loginTip" class="hint">登录信息只存在本机浏览器</span>
    </div>
    <div class="row" id="loggedRow" style="display:none">
      <span class="pill" id="userTip">已登录</span>
      <button id="logout">退出</button>
    </div>
  </div>

  <div class="card">
    <h2>2 · 音色</h2>
    <div class="row">
      <input id="kw" type="text" value="睿泽" style="width:130px">
      <button id="search">搜索音色</button>
      <span class="hint" id="searchTip">登录后自动搜索</span>
    </div>
    <div id="timbreList"></div>
  </div>

  <div class="card">
    <h2>3 · 语速 / 语调</h2>
    <div class="row" style="margin-bottom:8px">
      <span class="hint" style="width:64px">语速</span>
      <input id="speed" type="range" min="0.7" max="1.3" step="0.01" value="0.92">
      <span class="val" id="speedVal">0.92</span>
      <span class="hint">0.92 = 偏慢、沉稳；1.0 = 原速</span>
    </div>
    <div class="row">
      <span class="hint" style="width:64px">语调</span>
      <input id="pitch" type="range" min="-20" max="20" step="1" value="-4">
      <span class="val" id="pitchVal">-4</span>
      <span class="hint">负值更低沉，0 = 原声</span>
    </div>
    <div class="row" style="margin-top:8px">
      <span class="hint">情绪</span>
      <input id="emotion" type="text" value="常规-日常说话-3" style="width:180px">
      <span class="hint">默认即可，失败会自动退回“常规”</span>
    </div>
  </div>

  <div class="card">
    <h2>4 · 逐幕生成</h2>
    <div class="row" style="margin-bottom:10px">
      <button id="genAll" class="primary">生成全部</button>
      <span class="hint">每幕约 30–90 秒，期间不要关页面</span>
    </div>
    <div class="scenes" id="scenes"></div>
  </div>

  <div class="card">
    <h2>日志</h2>
    <div id="log"></div>
  </div>
</main>

<script>
const API = 'https://api.dubbingx.com';
let SCENES = [];                 // 由 playlist.json 生成：{ n, id, name }
const S = { token: localStorage.getItem('dbx_token') || '', timbres: [], timbre: null, busy: false };

const $ = id => document.getElementById(id);
const log = (msg) => {
  const el = $('log');
  const t = new Date().toTimeString().slice(0, 8);
  el.textContent += `[${t}] ${msg}\n`;
  el.scrollTop = el.scrollHeight;
};

function setScenes() {
  $('scenes').innerHTML = SCENES.map(s => `
    <div class="sc" data-n="${s.n}">
      <span class="nm" title="${s.name}">${s.n}. ${s.name}</span>
      <span class="st" id="st-${s.n}">未生成</span>
      <button data-one="${s.n}">只做这一幕</button>
    </div>`).join('');
  $('scenes').querySelectorAll('[data-one]').forEach(b => {
    b.onclick = () => generate([Number(b.dataset.one)]);
  });
}
function st(n, text, cls = '') {
  const el = $('st-' + n);
  if (!el) return;
  el.textContent = text;
  el.className = 'st ' + cls;
}

async function api(path, body, method = 'POST') {
  const res = await fetch(API + path, {
    method,
    headers: { 'Content-Type': 'application/json', 'token': S.token, 'X-Locale': 'zh_CN' },
    body: method === 'POST' ? JSON.stringify(body ?? {}) : undefined,
  });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { throw new Error('接口返回异常：' + text.slice(0, 120)); }
  if (data && (data.code === 200 || data.success === true)) return data.data;
  throw new Error((data && data.msg) || '请求失败');
}

/* ---------------- 登录 ---------------- */
$('sendCode').onclick = async () => {
  const phone = $('phone').value.trim();
  if (!/^1[3-9]\d{9}$/.test(phone)) return alert('请填 11 位手机号');
  $('sendCode').disabled = true;
  try {
    await api('/sendSmsCode', { phone });
    log('验证码已发送，请查收短信');
    $('loginTip').textContent = '验证码已发送，60 秒内有效';
    let left = 60;
    const timer = setInterval(() => {
      left--;
      $('sendCode').textContent = left > 0 ? `${left}s 后重发` : '发送验证码';
      if (left <= 0) { clearInterval(timer); $('sendCode').disabled = false; }
    }, 1000);
  } catch (e) {
    $('sendCode').disabled = false;
    log('发送失败：' + e.message);
    alert(e.message);
  }
};

$('doLogin').onclick = async () => {
  const phone = $('phone').value.trim();
  const code = $('code').value.trim();
  if (!phone || !code) return alert('请填手机号和验证码');
  $('doLogin').disabled = true;
  try {
    const data = await api('/smsLogin', { phone, code });
    const token = data && data.token;
    if (!token) throw new Error('没有拿到登录凭证');
    S.token = token;
    localStorage.setItem('dbx_token', token);
    log('登录成功');
    showLogged(true);
    await search();
  } catch (e) {
    log('登录失败：' + e.message);
    alert(e.message);
  } finally {
    $('doLogin').disabled = false;
  }
};

$('logout').onclick = () => {
  S.token = '';
  localStorage.removeItem('dbx_token');
  showLogged(false);
  log('已退出');
};

function showLogged(on) {
  $('loginRow').style.display = on ? 'none' : 'flex';
  $('loggedRow').style.display = on ? 'flex' : 'none';
  if (on) $('userTip').textContent = '已登录 · ' + S.token.slice(0, 6) + '…';
}

/* ---------------- 音色 ---------------- */
$('search').onclick = () => search();

async function search() {
  const kw = $('kw').value.trim();
  $('searchTip').textContent = '搜索中…';
  try {
    let list = [];
    for (const type of ['DubbingX', 'favorite']) {
      try {
        const d = await api('/voice/searchVoiceTimbreListV2', {
          pageIndex: 1, pageSize: 30, type, gender: '-1',
          timbreTagId: '-1', ageGroupId: '-1',
          includeTimbreSpeedTone: true, modelType: 'TTS', keyword: kw,
        });
        list = (d && d.list) || [];
        if (list.length) break;
      } catch (e) { log(`搜索（${type}）失败：${e.message}`); }
    }
    S.timbres = list;
    if (!list.length) {
      $('searchTip').textContent = '没搜到，换个关键词试试';
      return;
    }
    $('searchTip').textContent = `找到 ${list.length} 个`;
    renderTimbres();
  } catch (e) {
    $('searchTip').textContent = '搜索失败：' + e.message;
  }
}

function renderTimbres() {
  const box = $('timbreList');
  box.innerHTML = '';
  S.timbres.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = 'timbre';
    div.innerHTML = `<b>${t.name || t.timbreName || '未命名'}</b>
      <small>${t.modelVersion || ''} · ${t.gender === 1 ? '男' : t.gender === 0 ? '女' : '—'} · ${t.description || ''}</small>
      <span class="grow"></span>
      <small>${t.canUse === false ? '需购买' : '可用'}</small>`;
    div.onclick = () => {
      S.timbre = t;
      [...box.children].forEach(c => c.classList.remove('on'));
      div.classList.add('on');
      log(`已选音色：${t.name}（${t.timbreId}，${t.modelVersion || '未知版本'}）`);
    };
    box.appendChild(div);
    if (i === 0) div.click();
  });
}

/* ---------------- 生成 ---------------- */
$('genAll').onclick = () => generate(SCENES.map(s => s.n));

async function generate(list) {
  if (S.busy) return;
  if (!S.token) return alert('请先登录');
  if (!S.timbre) return alert('请先选音色');
  S.busy = true;
  $('genAll').disabled = true;
  try {
    for (const n of list) await one(n);
  } finally {
    S.busy = false;
    $('genAll').disabled = false;
  }
}

async function one(n) {
  const sc = SCENES[n - 1];
  st(n, '读取文稿…', 'run');
  try {
    const text = (await (await fetch(`srt/tts/spoken/${sc.id}.txt`)).text()).trim();
    if (!text) throw new Error('文稿为空（先跑 build/tts.js 或手写 spoken 稿）');

    st(n, '提交任务…', 'run');
    const speed = Number($('speed').value);
    let emotionKey = $('emotion').value.trim() || '常规-日常说话-3';
    const payload = [{
      timbreId: S.timbre.timbreId,
      emotionKey,
      language: 'zh',
      text,
      audioSpeed: speed,
      audioPitch: 1,
      audioVolume: 0,
      fileType: 'wav',
      index: 0,
      queueMode: false,
    }];
    let created;
    try {
      created = await api('/voice/voiceTtsTask/batchAddVoiceTtsTask', payload);
    } catch (e) {
      if (/情绪|emotion/i.test(e.message) && emotionKey !== '常规') {
        log(`情绪参数不被接受（${e.message}），改用“常规”重试`);
        payload[0].emotionKey = '常规';
        created = await api('/voice/voiceTtsTask/batchAddVoiceTtsTask', payload);
      } else throw e;
    }
    const first = Array.isArray(created) ? created[0] : created;
    const taskId = first && (first.taskId ?? first);
    if (!taskId || Number(taskId) === -1) throw new Error((first && first.msg) || '任务创建失败');
    log(`${sc.id} 任务 ${taskId} 已提交`);

    st(n, '合成中…', 'run');
    const info = await poll(taskId);
    if (info.status !== 'Completed' || !info.convertUrl) {
      throw new Error(info.message || `合成失败（${info.status}）`);
    }

    st(n, '下载并写入工程…', 'run');
    const r = await fetch(`/fetch_audio?t=${Date.now()}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: info.convertUrl, id: sc.id, scene: n }),
    });
    const saved = await r.json();
    if (!saved.ok) throw new Error(saved.msg || '写入失败');
    st(n, `完成 · ${saved.sec.toFixed(1)} 秒`, 'ok');
    log(`${sc.id} 已保存 audio/${sc.id}.wav（${saved.sec.toFixed(1)}s）`);
  } catch (e) {
    st(n, '失败：' + e.message, 'err');
    log(`${sc.id} 失败：${e.message}`);
  }
}

async function poll(taskId) {
  const t0 = Date.now();
  while (Date.now() - t0 < 6 * 60 * 1000) {
    const d = await api(`/voice/voiceTtsTask/getVoiceTtsTaskInfo/${taskId}`, {});
    const stt = d && (d.status || d.taskStatus);
    if (stt === 'Completed' || stt === 'Failed' || stt === 'Canceled') return d;
    await new Promise(r => setTimeout(r, 2000));
  }
  throw new Error('等待超时');
}

/* ---------------- 初始化 ---------------- */
$('speed').oninput = e => $('speedVal').textContent = Number(e.target.value).toFixed(2);
$('pitch').oninput = e => $('pitchVal').textContent = e.target.value;

(async function init() {
  try {
    const pj = await (await fetch('playlist.json')).json();
    SCENES = pj.scenes.map((s, i) => ({
      n: i + 1,
      id: s.id || `scene-${String(i + 1).padStart(2, '0')}`,
      name: s.title || `第 ${i + 1} 幕`,
    }));
  } catch (e) {
    log('读不到 playlist.json：' + e.message);
  }
  setScenes();
  if (S.token) {
    showLogged(true);
    api('/checkTokenValid', { token: S.token }).then(d => {
      if (!d || !d.isValid) { S.token = ''; localStorage.removeItem('dbx_token'); showLogged(false); return; }
      search();
    }).catch(() => { showLogged(false); });
  }
})();
</script>
</body>
</html>
